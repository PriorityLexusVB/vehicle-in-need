name: Deploy drift monitor

# Read-only watchdog: is the latest MERGED app code actually running in production?
# Born 2026-11-11 after PR #287 sat merged-but-not-live for days with no alert.
# It does not deploy, change traffic, or use any cloud credential: one public GET of
# /api/status plus local git history. When production is behind, it opens (or updates)
# one GitHub issue; when production catches up, it closes that issue.

on:
  schedule:
    - cron: "17 14 * * *" # daily, 09:17 America/New_York (standard time)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Check production against merged app code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check drift
        id: drift
        shell: bash
        run: |
          set +e
          node scripts/check-deploy-drift.cjs | tee drift-report.txt
          code="${PIPESTATUS[0]}"
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open, update, or close the drift issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.drift.outputs.exit_code }}
          TITLE: "Deploy drift: merged app code is not live in production"
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          body="$(printf 'Automated by .github/workflows/deploy-drift.yml (%s).\n\n```\n%s\n```\n\nThis check is read-only. Find the owner of the production release; do not hand-deploy around a guarded release process.\n' "$(date -u +%Y-%m-%dT%H:%MZ)" "$(cat drift-report.txt)")"
          if [ "${EXIT_CODE}" = "1" ]; then
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" --body "${body}"
            else
              gh issue create --title "${TITLE}" --body "${body}"
            fi
          elif [ "${EXIT_CODE}" = "0" ]; then
            if [ -n "${existing}" ]; then
              gh issue close "${existing}" --comment "Production now contains the latest merged app code. Closing automatically."
            fi
          else
            echo "::warning::Could not verify production (exit ${EXIT_CODE}). See report above."
            cat drift-report.txt
            exit 1
          fi
