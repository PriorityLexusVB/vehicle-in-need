name: Build and Push Container (Cloud Build)

# This workflow builds and pushes the container image to Artifact Registry
# using Google Cloud Build, which produces valid OCI images.
#
# The previous deployment failure was caused by an invalid OCI image with
# mismatched manifest layers and config diff_ids. This workflow ensures
# proper image structure by using Cloud Build's standard Docker builder.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'components/**'
      - 'services/**'
      - 'public/**'
      # Root-level app entry + shared modules (2026-06-07: were OMITTED — a
      # change to any of these merged + never triggered a deploy → silent
      # stale prod, same class as the 6-day outage. Codex-found.)
      - 'App.tsx'
      - 'index.tsx'
      - 'index.html'
      - 'types.ts'
      - 'constants.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'Dockerfile'
      - 'cloudbuild.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-and-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'components/**'
      - 'services/**'
      - 'public/**'
      # Root-level app entry + shared modules (2026-06-07: were OMITTED — a
      # change to any of these merged + never triggered a deploy → silent
      # stale prod, same class as the 6-day outage. Codex-found.)
      - 'App.tsx'
      - 'index.tsx'
      - 'index.html'
      - 'types.ts'
      - 'constants.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'Dockerfile'
      - 'cloudbuild.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-and-deploy.yml'
  # Manual trigger: builds the current main + deploys via cloudbuild.yaml's
  # deploy-cloud-run step (same path as push). 2026-06-07: the old `deploy`
  # input + separate `deploy` job were removed — that job duplicated
  # cloudbuild's deploy AND could never run (needed the push-only `build`).
  workflow_dispatch:
    inputs:
      release_action:
        description: "One-time PR287 recovery requires separate approval; normal build remains default"
        type: choice
        required: true
        default: build
        options:
          - build
          - repair-pr287-6753792
          - rollback-pr287-6753792
          - fence-legacy-trigger-wif-only
      bookkeeping_proof:
        description: "Main-verified V2 scalar capture; actual V1 preflight equality required"
        type: string
        required: false
        default: ''
      receiving_admission:
        description: "Main promotion admission, or late rollback receiving with separate approval; max8KiB"
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation

env:
  GCP_PROJECT_ID: gen-lang-client-0615287333
  GCP_REGION: us-west1
  ARTIFACT_REGISTRY: vehicle-in-need
  SERVICE_NAME: pre-order-dealer-exchange-tracker

jobs:
  validate:
    if: inputs.release_action != 'fence-legacy-trigger-wif-only'
    name: Validate Build Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned SDK runtime before release
        if: >-
          github.event_name == 'pull_request' && github.event.action == 'opened' &&
          github.head_ref == 'codex/pr287-sdk-v4-20261109' &&
          format('{0}', github.run_attempt) == '1'
        timeout-minutes: 3
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util,json,os,shutil,tempfile,hashlib,time
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('fixed','scripts/pr287-traffic-repair.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.start_budget('submit');started=time.monotonic();timings={}
          probe="""import sys,os,json,shutil,ssl,hashlib,subprocess,signal,tempfile,threading,time,urllib.request,urllib.parse,urllib.error,uuid,copy,re,calendar,datetime
          from pathlib import Path
          assert sys.version_info >= (3,10) and os.path.realpath(sys.executable) == os.path.realpath(ENTRYPOINT)
          assert sys.argv == ['-c','cloud-run-repair'] and sys.orig_argv[1] == '-c'
          assert ''.join(sys.orig_argv[4:]) == _sealed_code and 'x.run.app'.encode('idna') == b'x.run.app'
          assert shutil.which('gcloud') == '/usr/lib/google-cloud-sdk/bin/gcloud'
          assert hashlib.sha256(Path(os.environ['SSL_CERT_FILE']).read_bytes()).hexdigest() == '50f79f98dac192b20dbf73f35c56f0b0c557ab267ff5199d1117cc1180b70785'
          c=ssl.create_default_context();assert c.verify_mode == ssl.CERT_REQUIRED and c.check_hostname and c.cert_store_stats()['x509_ca'] == 120
          subprocess.run([sys.executable,'-c','import json,sys,urllib.request,urllib.parse,urllib.error,ssl; c=ssl.create_default_context(); assert c.check_hostname and c.cert_store_stats()["x509_ca"]==120'],stdin=subprocess.DEVNULL,check=True,timeout=10)
          result=subprocess.run(['gcloud','version','--format=json'],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=10,check=True)
          assert len(result.stdout)+len(result.stderr) <= 65536
          assert json.loads(result.stdout).get('Google Cloud SDK') == '592.0.0'
          print(json.dumps({'result':'PINNED_SDK_RUNTIME_PASS','python':sys.version.split()[0],'entrypoint':ENTRYPOINT,'actualExecutable':sys.executable,'gcloud':'592.0.0','originalArgvPreserved':True,'trustedCAs':120,'network':'none','privateProviderCalls':0}))
          """.replace('ENTRYPOINT',repr(m.SDK_PYTHON))
          with tempfile.TemporaryDirectory(prefix='sdk-public-only-') as empty_config:
              os.environ['DOCKER_CONFIG']=empty_config
              assert not os.environ.get('DOCKER_HOST') and not os.environ.get('DOCKER_CONTEXT'), 'Local default Docker context required'
              docker_root=m.command(['docker','info','--format','{{.DockerRootDir}}'])
              assert Path(docker_root).is_absolute() and Path(docker_root).is_dir(), 'Actual Docker data root required'
              free=shutil.disk_usage(docker_root).free;peak=3*1024**3
              storage_mode='LITERAL_20GB_AFTER_PEAK'
              if free-peak < 20000000000:
                  # PROPOSED ONLY: exact pending V4R2 card must approve this ONE
                  # disposable VehiclePR/attempt1 exception before source publication.
                  # Main boundary4D684A02; no HOME/WORK/default/later-CI waiver.
                  assert free >= 8*1024**3, 'One-proof hosted exception still requires 8GiB before 3GiB peak'
                  storage_mode='EXACT_APPROVED_ONE_PROOF_EPHEMERAL_EXCEPTION'
              print(json.dumps({'result':'ACTUAL_DOCKER_VOLUME_BUDGET_PASS','storageMode':storage_mode,'dockerRoot':docker_root,'freeBytes':free,'plannedPeakBytes':peak,'remainingAfterPeakBytes':free-peak,'defaultMinimumRemainingBytes':20000000000,'exceptionMinimumBeforePeakBytes':8*1024**3}))
              tick=time.monotonic();m.command(['docker','pull','--quiet','--platform=linux/amd64',m.SDK_IMAGE]);timings['publicPullSeconds']=time.monotonic()-tick
              fixed=['docker','run','--rm','--pull=never','--platform=linux/amd64','--read-only','--cap-drop=ALL','--security-opt=no-new-privileges','--pids-limit=64','--memory=256m','--cpus=1','--user=1000:1000','--tmpfs=/tmp:rw,noexec,nosuid,size=16m','--env=HOME=/tmp','--env=CLOUDSDK_CONFIG=/tmp/gcloud','--env=PYTHONDONTWRITEBYTECODE=1','--env=SSL_CERT_FILE='+m.SDK_CA_FILE,'--entrypoint='+m.SDK_PYTHON]
              tick=time.monotonic();runtime=json.loads(m.command([*fixed,'--network=none',m.SDK_IMAGE,*m.cloud_step_args(probe,'cloud-run-repair')]));timings['networklessRuntimeSeconds']=time.monotonic()-tick
              assert runtime['result']=='PINNED_SDK_RUNTIME_PASS' and runtime['entrypoint']==m.SDK_PYTHON and runtime['trustedCAs']==120 and runtime['network']=='none'
              tick=time.monotonic();raw=m.command([*fixed,'--network=bridge',m.SDK_IMAGE,'-c',m.STATUS_FETCH,m.BASE_URL]);timings['verifiedPublicTLSSeconds']=time.monotonic()-tick
              status=json.loads(raw);assert status.get('status')=='healthy' and status.get('version') in (m.PRIOR_VERSION,m.VERSION)
              assert m.BUDGET.counts==[4,0,0,0]
              print(json.dumps({'result':'PINNED_SDK_RUNTIME_AND_PUBLIC_TLS_PASS','image':m.SDK_IMAGE,'entrypoint':m.SDK_PYTHON,'caFile':m.SDK_CA_FILE,'networkless':runtime,'publicURL':m.BASE_URL+'/api/status','publicStatus':status['status'],'publicVersion':status['version'],'publicResponseSha256':hashlib.sha256(raw.encode()).hexdigest(),'publicGETs':1,'nativeCommands':4,'timings':timings,'totalSeconds':time.monotonic()-started,'privateProviderCalls':0}))
          PY

      - name: Validate Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "❌ Dockerfile not found"
            exit 1
          fi
          echo "✅ Dockerfile found"

      - name: Validate cloudbuild.yaml
        run: |
          if [ ! -f cloudbuild.yaml ]; then
            echo "❌ cloudbuild.yaml not found"
            exit 1
          fi
          echo "✅ cloudbuild.yaml found"

      - name: Check for conflict markers
        run: |
          if grep -r '<<<<<<< \|=======$\|>>>>>>> ' --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --exclude-dir=node_modules .; then
            echo "❌ Git merge conflict markers found in source code!"
            exit 1
          fi
          echo "✅ No conflict markers detected"

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: validate
    # main-only for BOTH triggers: a manual workflow_dispatch must also be on
    # main so it can never build+deploy a feature branch's code to prod.
    # One exact preparation-only squash must not auto-rebuild the pinned service.
    # Required squash subject: ci: prepare PR287 traffic repair only
    # Parent must be6753792; script separately guards parent, files and live state.
    if: >-
      inputs.release_action != 'fence-legacy-trigger-wif-only' &&
      (
        (format('{0}', github.run_attempt) == '1' ||
        (inputs.release_action != 'repair-pr287-6753792' && inputs.release_action != 'rollback-pr287-6753792')) &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        !(github.event_name == 'push' &&
        ((github.event.before == '6753792b1b51a65377b7e8a955fc27c68ecda799' &&
        startsWith(github.event.head_commit.message, 'ci: prepare PR287 traffic repair only')) ||
        (github.event.before == '0edd4e59f094cb576cd6cb9fd7f3cd798cd495ea' &&
        startsWith(github.event.head_commit.message, 'ci: prepare PR287 DNS repair only')) ||
        (github.event.before == '928c2db391e86c9a77c6e70e540fab0caa6774bf' &&
        startsWith(github.event.head_commit.message, 'ci: prepare PR287 SDK runtime only'))))
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate GCP auth inputs
        id: validate-gcp-auth
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS }}
        run: |
          set -euo pipefail
          echo "Validating GCP auth inputs..."

          # Check for authentication methods (WIF or Service Account Key)
          HAS_WIF=false
          HAS_SA_KEY=false

          if [ -n "$WIF_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            HAS_WIF=true
          fi

          if [ -n "$SA_KEY" ]; then
            HAS_SA_KEY=true
          fi

          # At least one method must be available
          if [ "$HAS_WIF" = false ] && [ "$HAS_SA_KEY" = false ]; then
            echo "::error::No GCP authentication configured"
            echo ""
            echo "Configure one of the following authentication methods:"
            echo "  1. Workload Identity Federation (recommended):"
            echo "     - GCP_WORKLOAD_IDENTITY_PROVIDER"
            echo "     - GCP_SERVICE_ACCOUNT"
            echo "  2. Service Account Key:"
            echo "     - GCP_SA_KEY"
            exit 1
          fi

          # Validate WIF if provided
          if [ "$HAS_WIF" = true ]; then
            echo "Validating Workload Identity Federation credentials..."

            # Validate GCP_WORKLOAD_IDENTITY_PROVIDER format
            if ! echo "$WIF_PROVIDER" | grep -qE '^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$'; then
              echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER has invalid format"
              echo "Expected format: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER"
              if [ "$HAS_SA_KEY" = false ]; then
                exit 1
              else
                echo "Will attempt Service Account Key authentication as fallback"
                HAS_WIF=false
              fi
            else
              echo "✅ GCP_WORKLOAD_IDENTITY_PROVIDER format is valid"
            fi

            # Validate GCP_SERVICE_ACCOUNT format
            if [ "$HAS_WIF" = true ] && ! echo "$SERVICE_ACCOUNT" | grep -qE '^[^@]+@[^@]+\.iam\.gserviceaccount\.com$'; then
              echo "::warning::GCP_SERVICE_ACCOUNT may have invalid format"
              echo "Expected format: SERVICE_ACCOUNT_NAME@PROJECT_ID.iam.gserviceaccount.com"
            elif [ "$HAS_WIF" = true ]; then
              echo "✅ GCP_SERVICE_ACCOUNT format is valid"
            fi
          fi

          # Set outputs for downstream steps
          echo "use_wif=$HAS_WIF" >> $GITHUB_OUTPUT
          echo "use_sa_key=$HAS_SA_KEY" >> $GITHUB_OUTPUT

          if [ "$HAS_WIF" = true ]; then
            echo "Will attempt Workload Identity Federation authentication"
          fi

          if [ "$HAS_SA_KEY" = true ]; then
            echo "Will use Service Account Key authentication"
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth-wif
        if: steps.validate-gcp-auth.outputs.use_wif == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key)
        id: auth-sa-key
        if: steps.validate-gcp-auth.outputs.use_sa_key == 'true' && (steps.validate-gcp-auth.outputs.use_wif != 'true' || steps.auth-wif.outcome == 'failure')
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS }}

      - name: Check authentication status
        id: auth-status
        run: |
          if [ "${{ steps.auth-wif.outcome }}" = "success" ]; then
            echo "✅ Authenticated using Workload Identity Federation"
            echo "auth_ok=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.auth-sa-key.outcome }}" = "success" ]; then
            echo "✅ Authenticated using Service Account Key"
            echo "auth_ok=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::All authentication methods failed"
            echo ""
            if [ "${{ steps.validate-gcp-auth.outputs.use_wif }}" = "true" ]; then
              echo "Workload Identity Federation failed - the pool or provider may not exist or be disabled"
              echo "To fix:"
              echo "  1. Verify the pool and provider exist in GCP"
              echo "  2. Or configure GCP_SA_KEY secret as a fallback"
              echo "  3. See docs/CI.md for setup instructions"
            elif [ "${{ steps.validate-gcp-auth.outputs.use_sa_key }}" = "true" ]; then
              echo "Service Account Key authentication failed - the key may be invalid or missing required permissions"
              echo "To fix:"
              echo "  1. Ensure the GCP_SA_KEY secret contains a valid service account key JSON"
              echo "  2. Verify the service account has the necessary IAM roles (Cloud Build Editor, Artifact Registry Writer)"
              echo "  3. See docs/CI.md for setup instructions"
            fi
            echo "auth_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip container build when auth unavailable
        if: steps.auth-status.outputs.auth_ok != 'true'
        run: |
          echo "⚠️  Skipping Cloud Build image build because GCP authentication was not successful."
          echo "### Container Build Skipped" >> $GITHUB_STEP_SUMMARY
          echo "- Reason: GCP authentication failed in this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "- Action: verify Workload Identity Federation/provider or set GCP_SA_KEY." >> $GITHUB_STEP_SUMMARY

      - name: Fail on auth failure for required deployment
        if: steps.auth-status.outputs.auth_ok != 'true' && (github.event_name == 'push' || inputs.release_action == 'repair-pr287-6753792' || inputs.release_action == 'rollback-pr287-6753792')
        run: |
          echo "::error::GCP authentication failed on push to main. Container image was NOT built."
          exit 1

      - name: Set up Cloud SDK
        if: steps.auth-status.outputs.auth_ok == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: steps.auth-status.outputs.auth_ok == 'true' && (inputs.release_action != 'repair-pr287-6753792' && inputs.release_action != 'rollback-pr287-6753792')
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Submit build to Cloud Build
        id: build
        if: steps.auth-status.outputs.auth_ok == 'true'
        env:
          RELEASE_ACTION: ${{ inputs.release_action || 'build' }}
          PR287_BOOKKEEPING_PROOF: ${{ inputs.bookkeeping_proof }}
          PR287_RECEIVING_ADMISSION: ${{ inputs.receiving_admission }}
        run: |
          if [ "$RELEASE_ACTION" = "repair-pr287-6753792" ] || [ "$RELEASE_ACTION" = "rollback-pr287-6753792" ]; then
            python3 scripts/pr287-traffic-repair.py submit || exit $?
            exit 0
          fi

          # Use the full GitHub SHA for the build, converted to short form
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Using SHORT_SHA: $SHORT_SHA (from commit: ${{ github.sha }})"

          # Build runs as the project's DEFAULT Cloud Build SA (unique id
          # 109495422803475379349), which holds Artifact Registry Writer +
          # Cloud Run deploy perms (this is the SA the build used pre-2026-05-30
          # when deploys worked). cloud-build-deployer (the authenticated caller)
          # must have roles/iam.serviceAccountUser (actAs) on that default SA —
          # Rob re-granted it 2026-06-05 after the WIF outage. Do NOT pin
          # --service-account to pre-order-dealer-exchange-860: that SA lacks AR
          # Writer (the 2026-06-05 push-denied error).
          BUILD_ID=$(gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=SHORT_SHA=$SHORT_SHA,_REGION=${{ env.GCP_REGION }},_SERVICE=${{ env.SERVICE_NAME }} \
            --format='value(id)')

          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "✅ Cloud Build submitted: $BUILD_ID"

      - name: Wait for build completion
        if: steps.auth-status.outputs.auth_ok == 'true'
        env:
          RELEASE_ACTION: ${{ inputs.release_action || 'build' }}
          PR287_BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          if [ "$RELEASE_ACTION" = "repair-pr287-6753792" ] || [ "$RELEASE_ACTION" = "rollback-pr287-6753792" ]; then
            python3 scripts/pr287-traffic-repair.py watch || exit $?
            exit 0
          fi

          echo "Waiting for build ${{ steps.build.outputs.build_id }} to complete..."
          gcloud builds log ${{ steps.build.outputs.build_id }} --stream

      - name: Verify build status
        if: steps.auth-status.outputs.auth_ok == 'true' && (inputs.release_action != 'repair-pr287-6753792' && inputs.release_action != 'rollback-pr287-6753792')
        run: |
          STATUS=$(gcloud builds describe ${{ steps.build.outputs.build_id }} --format='value(status)')
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "❌ Build failed with status: $STATUS"
            exit 1
          fi
          echo "✅ Build succeeded"

      # Post-deploy belt-and-suspenders checks. NON-FATAL (continue-on-error):
      # the real deploy is already verified by "Wait for build completion" +
      # "Verify build status" (the Cloud Build job includes the Cloud Run
      # deploy step). These two extra checks require Artifact Registry
      # read/pull perms that the deployer SA (cloud-build-deployer) does not
      # hold, so a failure here does NOT mean the deploy failed. Kept for
      # signal, but must never red-mark a successful deploy. (2026-06-05)
      - name: Verify image in Artifact Registry
        if: steps.auth-status.outputs.auth_ok == 'true' && (inputs.release_action != 'repair-pr287-6753792' && inputs.release_action != 'rollback-pr287-6753792')
        continue-on-error: true
        run: |
          IMAGE_PATH="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}"
          SHORT_SHA="${{ steps.build.outputs.short_sha }}"

          echo "Checking for image at: $IMAGE_PATH"
          if gcloud artifacts docker images list $IMAGE_PATH --limit=1 | grep -q "$SHORT_SHA"; then
            echo "✅ Image found in Artifact Registry with tag: $SHORT_SHA"
          else
            echo "⚠️ Could not confirm image via AR list (deployer SA lacks AR read) — deploy already verified upstream; non-fatal."
          fi

      - name: Inspect image structure (validation)
        if: steps.auth-status.outputs.auth_ok == 'true' && (inputs.release_action != 'repair-pr287-6753792' && inputs.release_action != 'rollback-pr287-6753792')
        continue-on-error: true
        run: |
          SHORT_SHA="${{ steps.build.outputs.short_sha }}"
          IMAGE_PATH="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:$SHORT_SHA"

          echo "Pulling image for inspection..."
          docker pull $IMAGE_PATH

          echo "Inspecting image structure..."
          docker inspect $IMAGE_PATH > /tmp/image-inspect.json

          LAYERS=$(jq -r '.[0].RootFS.Layers | length' /tmp/image-inspect.json)
          echo "Number of layers: $LAYERS"

          if [ "$LAYERS" -gt 0 ]; then
            echo "✅ Image has valid layer structure ($LAYERS layers)"
          else
            echo "❌ Image has no layers - this indicates a structural problem"
            exit 1
          fi

      - name: Generate deployment command
        if: steps.auth-status.outputs.auth_ok == 'true' && (inputs.release_action != 'repair-pr287-6753792' && inputs.release_action != 'rollback-pr287-6753792')
        run: |
          SHORT_SHA="${{ steps.build.outputs.short_sha }}"

          echo "### Deployment Command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "gcloud run deploy ${{ env.SERVICE_NAME }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:$SHORT_SHA \\" >> $GITHUB_STEP_SUMMARY
          echo "  --region=${{ env.GCP_REGION }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --platform=managed \\" >> $GITHUB_STEP_SUMMARY
          echo "  --allow-unauthenticated \\" >> $GITHUB_STEP_SUMMARY
          echo "  --set-env-vars=NODE_ENV=production,APP_VERSION=$SHORT_SHA,BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Deployed Version" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Short SHA**: $SHORT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY


  legacy_trigger_fence:
    name: Vehicle route unblock only - source proposal, explicit admission required
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_action == 'fence-legacy-trigger-wif-only' &&
      github.ref == 'refs/heads/vehicle-wif-route-unblock-20261112-r1' &&
      inputs.receiving_admission != '' &&
      format('{0}', github.run_attempt) == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: vehicle-wif-route-unblock-20261112-r1
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, auth action, SDK, CLI install, cache or artifact upload.
      # All eight OIDC/Google HTTP exchanges are counted inside this operator.
      - name: One admitted WIF-only fixed-trigger fence
        shell: bash
        env:
          VEHICLE_ROUTE_ADMISSION: ${{ inputs.receiving_admission }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          case "$RUNNER_TEMP" in /*) ;; *) exit 2 ;; esac
          operator=$(mktemp "$RUNNER_TEMP/vehicle-route-operator.XXXXXXXX.py")
          trap 'rm -f -- "$operator"; unset GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT ACTIONS_ID_TOKEN_REQUEST_TOKEN VEHICLE_ROUTE_ADMISSION' EXIT
          cat > "$operator" <<'VEHICLE_ROUTE_SOURCE'
          """Uninstalled Vehicle-only WIF route proposal. Default DISARMED; stdlib only.
          
          Live execution requires Main's source-bound native admission and exact Rob grant.
          No SDK, auth action, CLI, subprocess, redirect, retry or credential file is used.
          """
          import argparse
          import base64
          import hashlib
          import http.client
          import json
          import os
          import re
          import signal
          import ssl
          import time
          from pathlib import Path
          from urllib.parse import parse_qsl, quote, urlencode, urlsplit, urlunsplit
          
          PROJECT = "gen-lang-client-0615287333"
          NUMBER = "842946218691"
          REPO = "PriorityLexusVB/vehicle-in-need"
          BRANCH = "vehicle-wif-route-unblock-20261112-r1"
          REF = "refs/heads/" + BRANCH
          WORKFLOW = REPO + "/.github/workflows/build-and-deploy.yml@" + REF
          APPROVAL = "VEHICLE-WIF-ROUTE-UNBLOCK-20261112-R1"
          SA = "cloud-build-deployer@" + PROJECT + ".iam.gserviceaccount.com"  # expected TRIGGER build SA, not WIF caller
          WIF_SA_SELECTOR = "EXISTING_GITHUB_SECRET:GCP_SERVICE_ACCOUNT"
          TRIGGER = "fe4d7d76-07f2-4300-a7a6-8cba0e09c21e"
          RESOURCE = "projects/" + PROJECT + "/locations/global/triggers/" + TRIGGER
          TRIGGER_RESOURCE_URL = "https://cloudbuild.googleapis.com/v1/" + RESOURCE
          TRIGGER_URL = TRIGGER_RESOURCE_URL + "?" + urlencode({"projectId": PROJECT, "triggerId": TRIGGER})
          PATCH_URL = TRIGGER_URL + "&updateMask=disabled"
          BUILDS_URL = ("https://cloudbuild.googleapis.com/v1/projects/" + PROJECT
                        + "/locations/global/builds?" + urlencode({
                            "filter": 'buildTriggerId="' + TRIGGER + '" AND (status="PENDING" OR status="QUEUED" OR status="WORKING")',
                            "pageSize": "1"}))
          STS_URL = "https://sts.googleapis.com/v1/token"
          IAM_PREFIX = "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/"
          PERMISSIONS_URL = "https://cloudresourcemanager.googleapis.com/v1/projects/" + PROJECT + ":testIamPermissions"
          PERMISSIONS = ["cloudbuild.builds.get", "cloudbuild.builds.list", "cloudbuild.builds.create"]
          PATCH = b'{"disabled":true}'
          CAPS = {"requests": 8, "auth_requests": 3, "permission_requests": 1,
                  "fence_requests": 4, "request_bytes_each": 65536,
                  "request_bytes_total": 262144, "response_bytes_each": 1048576,
                  "response_bytes_total": 4194304, "total_seconds": 55,
                  "auth_preflight_seconds": 20, "fence_seconds": 35,
                  "response_seconds": 15, "before_to_patch_seconds": 5}
          HEX = re.compile(r"[0-9A-F]{64}\Z")
          COMMIT = re.compile(r"[0-9a-f]{40}\Z")
          TOKEN = re.compile(r"[A-Za-z0-9._~+/\-=]{1,16384}\Z")
          
          
          class Refusal(Exception):
              pass
          
          
          def require(condition, code):
              if not condition:
                  raise Refusal(code)
          
          
          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(",", ":"), allow_nan=False).encode()
          
          
          def sha(raw):
              return hashlib.sha256(raw).hexdigest().upper()
          
          
          def pairs(items):
              out = {}
              for key, value in items:
                  require(key not in out, "DUPLICATE_JSON_KEY")
                  out[key] = value
              return out
          
          
          def parse(raw):
              try:
                  value = json.loads(raw, object_pairs_hook=pairs,
                                     parse_constant=lambda _: (_ for _ in ()).throw(Refusal("NONFINITE_JSON")))
                  require(type(value) is dict, "JSON_OBJECT_REQUIRED")
                  return value
              except (ValueError, UnicodeError, RecursionError, TypeError):
                  raise Refusal("INVALID_JSON") from None
          
          
          class Budget:
              """One counter covers auth, rights preflight and fixed fence; no reset."""
              def __init__(self, clock=time.monotonic):
                  self.clock = clock
                  self.start = clock()
                  self.calls = []
                  self.sent = 0
                  self.received = 0
                  self.fence_at = None
                  self.before_at = None
          
              def remaining(self, deadline=None):
                  now = self.clock()
                  end = self.start + CAPS["total_seconds"]
                  end = min(end, self.start + CAPS["auth_preflight_seconds"]) if self.fence_at is None else min(
                      end, self.fence_at + CAPS["fence_seconds"])
                  if deadline is not None:
                      end = min(end, deadline)
                  require(now < end, "TIME_BUDGET")
                  return end - now
          
              def reserve(self, phase, method, url, headers, body):
                  self.remaining()
                  if method == "PATCH":
                      require(self.before_at is not None and self.clock() - self.before_at <= 5, "BEFORE_READ_STALE")
                  require(phase in ("auth", "permission", "fence"), "PHASE")
                  limit = {"auth": 3, "permission": 1, "fence": 4}[phase]
                  require(len(self.calls) < 8 and sum(x[0] == phase for x in self.calls) < limit, "REQUEST_BUDGET")
                  u = urlsplit(url)
                  require(u.scheme == "https" and not u.username and not u.password and u.port in (None, 443)
                          and not u.fragment and u.hostname == u.netloc, "HTTPS_URL")
                  target = u.path + ("?" + u.query if u.query else "")
                  head = method + " " + target + " HTTP/1.1\r\n"
                  head += "".join(k + ": " + v + "\r\n" for k, v in headers.items()) + "\r\n"
                  try:
                      raw = head.encode("ascii") + body
                  except UnicodeError:
                      raise Refusal("REQUEST_ASCII") from None
                  require(len(raw) <= CAPS["request_bytes_each"] and
                          self.sent + len(raw) <= CAPS["request_bytes_total"], "REQUEST_BYTES")
                  self.sent += len(raw)
                  self.calls.append((phase, method))  # reserve BEFORE any connect/token/effect
                  return self.clock() + min(CAPS["response_seconds"], self.remaining())
          
              def receive(self, size, response_count):
                  self.received += size
                  require(response_count <= CAPS["response_bytes_each"] and
                          self.received <= CAPS["response_bytes_total"], "RESPONSE_BYTES")
                  self.remaining()
          
          
          class GuardedFile:
              """Counts raw status/header/chunk/body bytes, before HTTP parsing."""
              def __init__(self, raw, sock, budget, deadline):
                  self.raw, self.sock, self.budget, self.deadline = raw, sock, budget, deadline
                  self.count = 0
          
              def _read(self, method, amount):
                  remaining = min(CAPS["response_bytes_each"] - self.count,
                                  CAPS["response_bytes_total"] - self.budget.received)
                  if amount == 0:
                      return b""
                  require(remaining > 0, "RESPONSE_BYTES")
                  limit = remaining if amount is None or amount < 0 else min(amount, remaining)
                  self.sock.settimeout(self.budget.remaining(self.deadline))
                  data = getattr(self.raw, method)(limit)
                  self.count += len(data)
                  self.budget.receive(len(data), self.count)
                  self.budget.remaining(self.deadline)
                  return data
          
              def read(self, amount=-1):
                  return self._read("read", amount)
          
              def readline(self, amount=-1):
                  return self._read("readline", amount)
          
              def close(self):
                  self.raw.close()
          
              def flush(self):
                  self.raw.flush()
          
          
          class ResponseSocket:
              def __init__(self, sock, budget, deadline):
                  self.sock, self.budget, self.deadline = sock, budget, deadline
          
              def makefile(self, *args, **kwargs):
                  return GuardedFile(self.sock.makefile("rb"), self.sock, self.budget, self.deadline)
          
          
          class Transport:
              def __init__(self, budget):
                  self.budget = budget
          
              def request(self, phase, method, url, body=b"", bearer=None):
                  require(type(body) is bytes, "BODY_TYPE")
                  require(method in ("GET", "POST", "PATCH"), "METHOD")
                  require(url in (STS_URL, PERMISSIONS_URL, TRIGGER_URL,
                                  PATCH_URL, BUILDS_URL)
                          or (phase == "auth" and method == "POST" and valid_iam_url(url))
                          or (phase == "auth" and method == "GET" and valid_oidc_url(url)), "ENDPOINT")
                  u = urlsplit(url)
                  headers = {"Host": u.hostname, "Connection": "close", "Accept": "application/json",
                             "Content-Length": str(len(body))}
                  if body:
                      headers["Content-Type"] = "application/json"
                  if bearer is not None:
                      require(type(bearer) is str and TOKEN.fullmatch(bearer), "TOKEN_FORMAT")
                      headers["Authorization"] = "Bearer " + bearer
                  deadline = self.budget.reserve(phase, method, url, headers, body)
                  return self._send(method, url, headers, body, deadline)
          
              def _send(self, method, url, headers, body, deadline):
                  u = urlsplit(url)
                  conn = http.client.HTTPSConnection(u.hostname, timeout=self.budget.remaining(deadline),
                                                     context=ssl.create_default_context())
                  response = None
                  try:
                      send_deadline = deadline
                      if method == "PATCH":
                          send_deadline = min(deadline, self.budget.before_at + 5)
                      conn.timeout = self.budget.remaining(send_deadline)
                      conn.connect()
                      conn.putrequest(method, u.path + ("?" + u.query if u.query else ""),
                                      skip_host=True, skip_accept_encoding=True)
                      for key, value in headers.items():
                          conn.putheader(key, value)
                      self.budget.remaining(send_deadline)
                      conn.endheaders(body)
                      conn.response_class = lambda sock, **kw: http.client.HTTPResponse(
                          ResponseSocket(sock, self.budget, deadline), **kw)
                      response = conn.getresponse()
                      require(response.status == 200, "HTTP_STATUS_NO_RETRY")
                      require(not response.getheader("Location"), "REDIRECT_FORBIDDEN")
                      enc = response.getheader("Content-Encoding")
                      require(enc in (None, "identity"), "CONTENT_ENCODING")
                      content_types = [v for k, v in response.getheaders() if k.lower() == "content-type"]
                      require(len(content_types) == 1 and content_types[0].split(";")[0].strip() == "application/json",
                              "CONTENT_TYPE")
                      data = bytearray()
                      while True:
                          chunk = response.read(65536)
                          if not chunk:
                              break
                          data.extend(chunk)
                          self.budget.remaining(deadline)
                      return parse(bytes(data))
                  except Refusal:
                      raise
                  except Exception:
                      raise Refusal("TRANSPORT_FAILED_NO_RETRY") from None
                  finally:
                      if response:
                          response.close()
                      conn.close()
          
          
          def valid_service_account(value):
              return type(value) is str and re.fullmatch(
                  r"[a-z][a-z0-9-]{4,28}[a-z0-9]@" + re.escape(PROJECT) + r"\.iam\.gserviceaccount\.com", value) is not None
          
          
          def valid_iam_url(url):
              return url.startswith(IAM_PREFIX) and url.endswith(":generateAccessToken") and valid_service_account(
                  url[len(IAM_PREFIX):-len(":generateAccessToken")])
          
          
          def valid_oidc_url(url):
              try:
                  u = urlsplit(url)
                  # URL originates in the GitHub runner, never caller input. Host suffix
                  # is not identity proof; exact claims and STS verification follow.
                  return (u.scheme == "https" and u.hostname is not None
                          and u.hostname.endswith(".actions.githubusercontent.com")
                          and not u.username and not u.password and u.port in (None, 443)
                          and not u.fragment and not any(ord(c) < 33 for c in url))
              except ValueError:
                  return False
          
          
          def admission(raw, env, source_sha, now):
              require(type(raw) is bytes and len(raw) <= 8192, "ADMISSION_BYTES")
              a = parse(raw)
              expected = {"approval", "source_sha256", "commit", "ref", "repository", "caps",
                          "expires", "issued", "reservation_id", "native_human_sha256",
                          "native_reservation_sha256", "wif_selector_names",
                          "service_account", "publication_preflight_sha256", "remaining_attempts"}
              require(set(a) == expected, "ADMISSION_FIELDS")
              require(a["approval"] == APPROVAL and a["source_sha256"] == source_sha and
                      a["repository"] == REPO and a["ref"] == REF and a["caps"] == CAPS and
                      a["service_account"] == WIF_SA_SELECTOR and a["wif_selector_names"] ==
                      ["GCP_WORKLOAD_IDENTITY_PROVIDER", "GCP_SERVICE_ACCOUNT"] and type(a["remaining_attempts"]) is int and
                      a["remaining_attempts"] == 1, "ADMISSION_SCOPE")
              require(type(a["commit"]) is str and COMMIT.fullmatch(a["commit"]), "COMMIT")
              require(type(a["reservation_id"]) is str and re.fullmatch(r"[A-F0-9]{32}", a["reservation_id"]), "RESERVATION")
              for key in ("native_human_sha256", "native_reservation_sha256", "publication_preflight_sha256"):
                  require(type(a[key]) is str and HEX.fullmatch(a[key]) and a[key] != "0" * 64, "ADMISSION_PIN")
              require(type(a["issued"]) is int and type(a["expires"]) is int and
                      0 <= now - a["issued"] <= 120 and now + CAPS["total_seconds"] <= a["expires"]
                      <= a["issued"] + 120, "ADMISSION_FRESHNESS")
              require(env.get("GITHUB_ACTIONS") == "true" and env.get("GITHUB_REPOSITORY") == REPO and
                      env.get("GITHUB_REF") == REF and env.get("GITHUB_SHA") == a["commit"] and
                      env.get("GITHUB_WORKFLOW_REF") == WORKFLOW and
                      env.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and env.get("GITHUB_RUN_ATTEMPT") == "1"
                      and re.fullmatch(r"[1-9][0-9]{0,19}", env.get("GITHUB_RUN_ID", "")), "RUN_CONTEXT")
              return a
          
          
          def validate_claims(jwt, env, audience, now):
              try:
                  segments = jwt.split(".")
                  require(len(segments) == 3 and all(re.fullmatch(r"[A-Za-z0-9_-]+", x) for x in segments), "OIDC_FORMAT")
                  claims = parse(base64.urlsafe_b64decode(segments[1] + "=" * (-len(segments[1]) % 4)))
              except (ValueError, UnicodeError):
                  raise Refusal("OIDC_FORMAT") from None
              expected = {"iss": "https://token.actions.githubusercontent.com", "aud": audience,
                          "sub": "repo:" + REPO + ":ref:" + REF, "repository": REPO, "ref": REF,
                          "sha": env["GITHUB_SHA"], "workflow_ref": WORKFLOW, "event_name": "workflow_dispatch",
                          "run_id": env["GITHUB_RUN_ID"], "run_attempt": "1"}
              require(all(claims.get(k) == v for k, v in expected.items()), "OIDC_CLAIMS")
              require(type(claims.get("iat")) is int and type(claims.get("exp")) is int and
                      0 <= now - claims["iat"] <= 60 and claims["exp"] > now + 20, "OIDC_FRESHNESS")
              # Local parsing is NOT signature verification. STS receives these SAME bytes;
              # only successful STS exchange establishes the configured provider's trust.
          
          
          def validate_trigger(t):
              g = t.get("github")
              require(t.get("resourceName") == RESOURCE and t.get("id") == TRIGGER and
                      t.get("name") == "vehicle-in-need-deploy" and t.get("filename") == "cloudbuild.yaml" and
                      t.get("serviceAccount") == "projects/" + PROJECT + "/serviceAccounts/" + SA, "TRIGGER_IDENTITY")
              require(type(g) is dict and g.get("owner") == "PriorityLexusVB" and g.get("name") == "vehicle-in-need"
                      and type(g.get("push")) is dict and g["push"].get("branch") == "^main$"
                      and g["push"].get("invertRegex", False) is False and not g["push"].get("tag"), "TRIGGER_SOURCE")
              require(not any(t.get(k) for k in ("triggerTemplate", "repositoryEventConfig", "pubsubConfig",
                                               "webhookConfig", "sourceToBuild")), "ALTERNATE_TRIGGER_SOURCE")
              require("disabled" not in t or type(t["disabled"]) is bool, "DISABLED_TYPE")
          
          
          def project_trigger_metadata(raw):
              """Pure projection for Main's one existing-identity metadata GET. No auth/network."""
              require(type(raw) is bytes and len(raw) <= CAPS["response_bytes_each"], "METADATA_RESPONSE_BYTES")
              t = parse(raw)
              validate_trigger(t)
              return {"target_match": True, "repo_match": True, "main_only_push_filter": True,
                      "filename_match": True, "deployer_service_account_match": True,
                      "disabled": t.get("disabled", False), "complete_trigger_sha256": sha(canonical(t)),
                      "candidate_ref_excluded_by_this_trigger": True,
                      "other_triggers_or_remote_workflows_certified": False}
          
          
          def run(client, env, a, wall=time.time):
              b = client.budget
              stage, patch_state = "AUTH", "NOT_ATTEMPTED"
              before_hash = after_hash = None
              provider_hash = principal_hash = None
              result = None
              sensitive = {}
              try:
                  provider = env.get("GCP_WORKLOAD_IDENTITY_PROVIDER", "")
                  service_account = env.get("GCP_SERVICE_ACCOUNT", "")
                  oidc_url = env.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
                  require(re.fullmatch(r"projects/" + NUMBER + r"/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+", provider),
                          "WIF_PROVIDER_BINDING")
                  require(valid_service_account(service_account) and valid_oidc_url(oidc_url), "WIF_SELECTOR_OR_OIDC_BINDING")
                  provider_hash, principal_hash = sha(provider.encode()), sha(service_account.encode())
                  audience = "//iam.googleapis.com/" + provider
                  u = urlsplit(oidc_url)
                  query = parse_qsl(u.query, keep_blank_values=True)
                  require(not any(k == "audience" for k, _ in query), "OIDC_AUDIENCE_ALREADY_PRESENT")
                  request_url = urlunsplit((u.scheme, u.netloc, u.path, urlencode(query + [("audience", audience)]), ""))
                  token = env.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
                  require(TOKEN.fullmatch(token) is not None, "RUNNER_TOKEN_FORMAT")
                  sensitive["oidc"] = client.request("auth", "GET", request_url, bearer=token).get("value")
                  require(type(sensitive["oidc"]) is str and TOKEN.fullmatch(sensitive["oidc"]), "OIDC_TOKEN")
                  validate_claims(sensitive["oidc"], env, audience, int(wall()))
                  sts = client.request("auth", "POST", STS_URL, canonical({
                      "audience": audience, "grantType": "urn:ietf:params:oauth:grant-type:token-exchange",
                      "requestedTokenType": "urn:ietf:params:oauth:token-type:access_token",
                      "scope": "https://www.googleapis.com/auth/cloud-platform",
                      "subjectTokenType": "urn:ietf:params:oauth:token-type:jwt",
                      "subjectToken": sensitive["oidc"]}))
                  require(sts.get("token_type") == "Bearer" and sts.get("issued_token_type") ==
                          "urn:ietf:params:oauth:token-type:access_token", "STS_TYPE")
                  sensitive["sts"] = sts.get("access_token")
                  require(type(sensitive["sts"]) is str and TOKEN.fullmatch(sensitive["sts"]), "STS_TOKEN")
                  iam = client.request("auth", "POST", IAM_PREFIX + service_account + ":generateAccessToken", canonical({
                      "scope": ["https://www.googleapis.com/auth/cloud-platform"], "lifetime": "300s"}),
                      bearer=sensitive["sts"])
                  sensitive["access"] = iam.get("accessToken")
                  require(type(sensitive["access"]) is str and TOKEN.fullmatch(sensitive["access"]), "IAM_TOKEN")
                  rights = client.request("permission", "POST", PERMISSIONS_URL,
                                          canonical({"permissions": PERMISSIONS}), bearer=sensitive["access"])
                  require(set(rights) == {"permissions"} and type(rights["permissions"]) is list
                          and sorted(rights["permissions"]) == sorted(PERMISSIONS), "EXISTING_RIGHTS_REQUIRED")
                  b.remaining()
                  b.fence_at = b.clock()
                  stage = "BEFORE_GET"
                  before = client.request("fence", "GET", TRIGGER_URL, bearer=sensitive["access"])
                  validate_trigger(before)
                  before_hash, before_at = sha(canonical(before)), b.clock()
                  b.before_at = before_at
                  expected = dict(before)
                  expected["disabled"] = True
                  if not before.get("disabled", False):
                      stage = "PATCH_DISABLED_ONLY"
                      require(b.clock() - before_at <= CAPS["before_to_patch_seconds"], "BEFORE_READ_STALE")
                      patch_state = "POSSIBLE_EFFECT_UNKNOWN"  # before transport may send
                      patched = client.request("fence", "PATCH", PATCH_URL,
                                               PATCH, bearer=sensitive["access"])
                      validate_trigger(patched)
                      require(patched == expected, "PATCH_COMPLETE_FIELD_DRIFT")
                  stage = "AFTER_GET"
                  after = client.request("fence", "GET", TRIGGER_URL, bearer=sensitive["access"])
                  validate_trigger(after)
                  require(after == expected, "READBACK_COMPLETE_FIELD_DRIFT")
                  after_hash = sha(canonical(after))
                  patch_state = "DISABLED_READBACK_CONFIRMED" if not before.get("disabled", False) else "ALREADY_DISABLED_READBACK"
                  stage = "EMPTY_ACTIVE_BUILDS"
                  builds = client.request("fence", "GET", BUILDS_URL, bearer=sensitive["access"])
                  require(set(builds) <= {"builds", "nextPageToken"} and builds.get("nextPageToken") in (None, "")
                          and type(builds.get("builds", [])) is list and not builds.get("builds", []), "ACTIVE_BUILDS_OR_PAGINATION")
                  result = {"status": "ROUTE_FENCED", "reason": "FIXED_TARGET_READBACK_AND_EMPTY_BUILDS"}
              except Refusal as exc:
                  result = {"status": "HOLD", "reason": str(exc)}
              except Exception:
                  result = {"status": "HOLD", "reason": "UNCLASSIFIED_FAILURE_NO_RETRY"}
              finally:
                  sensitive.clear()
                  for key in ("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "GCP_WORKLOAD_IDENTITY_PROVIDER", "GCP_SERVICE_ACCOUNT"):
                      env.pop(key, None)
              result.update({"stage": stage, "patch_state": patch_state, "calls": len(b.calls),
                             "auth_calls": sum(p == "auth" for p, _ in b.calls),
                             "permission_calls": sum(p == "permission" for p, _ in b.calls),
                             "fence_calls": sum(p == "fence" for p, _ in b.calls),
                             "request_bytes": b.sent, "response_bytes": b.received,
                             "before_sha256": before_hash, "after_sha256": after_hash,
                             "wif_provider_metadata_sha256": provider_hash, "selected_principal_metadata_sha256": principal_hash,
                             "credential_files_created": 0, "rollback": "NOT_AUTHORIZED",
                             "elapsed_seconds": round(b.clock() - b.start, 3)})
              return result
          
          
          def consume_local_reservation(root, reservation_id):
              journal = Path(root) / ("vehicle-route-" + reservation_id + ".consumed")
              require(journal.parent.is_dir() and journal.parent.is_absolute(), "RUNNER_TEMP")
              fd = os.open(str(journal), os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
              with os.fdopen(fd, "wb") as out:
                  out.write(canonical({"reservation_id": reservation_id, "state": "CONSUMED_BEFORE_AUTH"}))
                  out.flush()
                  os.fsync(out.fileno())
              return journal
          
          
          def main(argv=None):
              parser = argparse.ArgumentParser(description="DISARMED Vehicle WIF route proposal")
              parser.add_argument("--execute", action="store_true")
              args = parser.parse_args(argv)
              if not args.execute:
                  print('{"status":"DISARMED","credential_reads":0,"provider_requests":0}')
                  return 0
              b = Budget()
              try:
                  # Only nonsensitive context/admission is read until admission validation.
                  raw = os.environ.get("VEHICLE_ROUTE_ADMISSION", "").encode()
                  a = admission(raw, os.environ, sha(Path(__file__).read_bytes()), int(time.time()))
                  require(os.name == "posix" and hasattr(signal, "SIGALRM"), "LINUX_WATCHDOG_REQUIRED")
                  signal.signal(signal.SIGALRM, lambda *_: (_ for _ in ()).throw(Refusal("HARD_WALL_TIMEOUT")))
                  signal.setitimer(signal.ITIMER_REAL, CAPS["total_seconds"] - (b.clock() - b.start))
                  # Main's existing native durable reservation is authoritative across CI runs.
                  # This O_EXCL marker is an additional same-run no-reentry guard, not a queue.
                  consume_local_reservation(os.environ.get("RUNNER_TEMP", ""), a["reservation_id"])
                  result = run(Transport(b), os.environ, a)
                  print(json.dumps(result, sort_keys=True))
                  return 0 if result["status"] == "ROUTE_FENCED" else 2
              except Refusal as exc:
                  print(json.dumps({"status": "HOLD", "reason": str(exc), "calls": len(b.calls),
                                    "rollback": "NOT_AUTHORIZED"}))
                  return 2
              except Exception:
                  print('{"status":"HOLD","reason":"LOCAL_ADMISSION_OR_WATCHDOG_FAILURE_NO_RETRY"}')
                  return 2
              finally:
                  if hasattr(signal, "setitimer"):
                      signal.setitimer(signal.ITIMER_REAL, 0)
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          
